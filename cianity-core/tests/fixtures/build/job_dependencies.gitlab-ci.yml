stages:
  - build
  - test

compile:
  stage: build
  image: "rust:1.75"
  dependencies: []
  script:
    - cargo build --release

lint:
  stage: build
  image: "rust:1.75"
  dependencies:
    - compile
  script:
    - cargo clippy -- -D warnings

unit:
  stage: test
  image: "rust:latest"
  dependencies:
    - compile
  script:
    - cargo test

integration:
  stage: test
  image: "rust:latest"
  dependencies:
    - compile
    - unit
  script:
    - cargo test --test integration
