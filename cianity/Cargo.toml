[package]
name = "cianity"
version = "0.1.0"
rust-version = "1.92.0"
edition = "2024"
authors = ["Hayden Stainsby <hds@caffeineconcepts.com>"]
readme = "README.md"
description = """
Add a bit of sanity to your CI.
"""
license = "MIT"
repository = "https://github.com/hds/cianity"
categories = ["development-tools"]
keywords = ["ci", "ci/cd"]

[dependencies]
ciane = { path = "../ciane" }
cianity-core = { path = "../cianity-core" }
ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp-server = "0.23"
anyhow = "1"
rowan = "0.16"

[lints]
workspace = true
