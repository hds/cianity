stages:
  - build
  - test
  - cianity_check

build_debug:
  stage: build
  image: "rust:1.96-slim-trixie"
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - cargo build --workspace

build_release:
  stage: build
  image: "rust:1.96-slim-trixie"
  dependencies: []
  artifacts:
    paths:
      - target/release/cianity
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - cargo build --release --workspace

test:
  stage: test
  image: "rust:1.96-trixie"
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
    - cargo nextest run --workspace

fmt:
  stage: test
  image: "rust:1.96-slim-trixie"
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  stage: test
  image: "rust:1.96-slim-trixie"
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - rustup component add clippy
    - cargo clippy

check:
  stage: cianity_check
  image: "rust:1.96-trixie"
  dependencies:
    - build_release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  script:
    - ./target/release/cianity check
    - ./target/release/cianity format --check
    - |
      ./target/release/cianity build -t gitlab
      # TODO: fix this after implementing build --check
      [ "$(git diff --name-only)" == "" ] || ( echo "error: pipeline doesn't match workflow.ci!"; exit 1 )
